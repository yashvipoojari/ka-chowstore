<!DOCTYPE html>

<html>
<head>
<title>Collection - KA-CHOW</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#0a0a0a;
  color:white;
}

/* NAVBAR */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 50px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
}

header h1 {
  color:white;
  letter-spacing:3px;
  font-weight:300;
}

nav a {
  color:white !important;
  text-decoration:none;
  margin-left:25px;
  font-size:14px;
  letter-spacing:1px;
  transition:0.3s;
}

nav a:hover {
  color:#aaa;
}

/* HERO */
.hero {
  height:45vh;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
  url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80') center/cover;
}

/* FILTER BAR */
.controls {
  padding:20px 50px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

input, select {
  padding:10px;
  background:#111;
  color:white;
  border:none;
}

/* GRID */
.grid {
  padding:40px 50px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:30px;
}

/* CARD */
.card {
  background:#111;
  border-radius:15px;
  overflow:hidden;
  transition:0.4s;
}

.card:hover { transform:translateY(-8px); }

.card img {
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-content { padding:15px; }

.price { color:#aaa; }

button {
  margin-top:8px;
  padding:10px;
  width:100%;
  background:#222;
  color:white;
  border:none;
  cursor:pointer;
}
</style>

</head>

<body>

<header>
  <h1>KA-CHOW!</h1>

  <nav>
    <a href="index.html">HOME</a>
    <a href="products.html">COLLECTION</a>
    <a href="cart.html">CART</a>
    <a href="login.html">LOGIN</a>
  </nav>
</header>

<div class="hero"></div>

<div class="controls">
  <input id="search" placeholder="Search models...">
  <select id="brandFilter"><option value="">All Brands</option></select>
  <select id="scaleFilter"><option value="">All Scales</option></select>
</div>

<div id="products" class="grid"></div>

<script>
let allProducts = [];

fetch("products.json")
.then(res => res.json())
.then(data => {
  allProducts = data;
  render(data);
  loadFilters(data);
});

function render(data){
  let container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach((p, index) => {

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p['Primary Image'] || ''}">
      <div class="card-content">
        <h3>${p['Title'] || ''}</h3>
        <p>${p['Brand'] || ''} ${p['Scale'] ? "- " + p['Scale'] : ""}</p>
        <p class="price">${p['Sale Price'] || ''}</p>

        <button class="viewBtn">View</button>
        <button class="cartBtn">Add to Cart</button>
      </div>
    `;

    card.querySelector(".viewBtn").onclick = () => viewProduct(index);
    card.querySelector(".cartBtn").onclick = () => addToCart(index);

    container.appendChild(card);
  });
}

function loadFilters(data){
  let brands = [...new Set(data.map(p => p.Brand).filter(Boolean))];
  let scales = [...new Set(data.map(p => p.Scale).filter(Boolean))];

  brands.forEach(b =>
    document.getElementById("brandFilter").innerHTML += `<option>${b}</option>`
  );

  scales.forEach(s =>
    document.getElementById("scaleFilter").innerHTML += `<option>${s}</option>`
  );
}

document.getElementById("search").oninput = filter;
document.getElementById("brandFilter").onchange = filter;
document.getElementById("scaleFilter").onchange = filter;

function filter(){
  let text = search.value.toLowerCase();
  let brand = brandFilter.value;
  let scale = scaleFilter.value;

  let filtered = allProducts.filter(p =>
    (p.Title || "").toLowerCase().includes(text) &&
    (brand=="" || p.Brand==brand) &&
    (scale=="" || p.Scale==scale)
  );

  render(filtered);
}

function viewProduct(i){
  localStorage.setItem("product", JSON.stringify(allProducts[i]));
  window.location.href = "product.html";
}

function addToCart(i){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push(allProducts[i]);
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart");
}
</script>

</body>
</html>
